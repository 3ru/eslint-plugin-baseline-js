name: Linter Compatibility

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve released plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - name: Record run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p conformance/results/input
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '{repository: .repository.full_name, id: (.id | tostring), number: .run_number, attempt: .run_attempt, commit: .head_sha, startedAt: (.run_started_at // .created_at)}' \
            > conformance/results/input/context.json
      - name: Prepare exact npm artifact and product lock
        run: node conformance/subject.ts --out conformance/results/input/subject
      - name: Save shared input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-input
          path: |
            conformance/results/input/context.json
            conformance/results/input/subject/subject.json
            conformance/results/input/subject/subject.tgz
            conformance/results/input/subject/package.json
            conformance/results/input/subject/pnpm-lock.yaml
          overwrite: true
          retention-days: 7
          if-no-files-found: warn

  measure:
    name: Measure (${{ matrix.profile }})
    permissions:
      contents: read
      actions: read
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [pinned, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compatibility-input
          path: conformance/results/input
      - name: Record collector attempt identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '{repository: .repository.full_name, id: (.id | tostring), number: .run_number, attempt: .run_attempt, commit: .head_sha, startedAt: (.run_started_at // .created_at)}' \
            > conformance/results/collector-context.json
      - name: Measure host capabilities and Baseline detection
        env:
          CONFORMANCE_PROFILE: ${{ matrix.profile }}
        run: >-
          node conformance/run.ts
          --subject conformance/results/input/subject
          --context conformance/results/collector-context.json
          --out conformance/results/${{ matrix.profile }}
      - name: Show measurement
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ -f "conformance/results/$PROFILE/report.md" ]; then
            cat "conformance/results/$PROFILE/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'No measurement report was produced. Check the setup and execution logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save observations and reproduction inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-${{ matrix.profile }}
          path: |
            conformance/results/${{ matrix.profile }}/profile.json
            conformance/results/${{ matrix.profile }}/identity.json
            conformance/results/${{ matrix.profile }}/report.json
            conformance/results/${{ matrix.profile }}/report.md
            conformance/results/${{ matrix.profile }}/raw/**
            conformance/results/${{ matrix.profile }}/work/**
            conformance/results/${{ matrix.profile }}/subject-input/subject.json
            conformance/results/${{ matrix.profile }}/subject-input/package.json
            conformance/results/${{ matrix.profile }}/subject-input/pnpm-lock.yaml
            conformance/results/${{ matrix.profile }}/tools/package.json
            conformance/results/${{ matrix.profile }}/tools/pnpm-lock.yaml
          include-hidden-files: true
          overwrite: true
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Publish compatibility snapshot
    needs: [prepare, measure]
    if: >-
      ${{ always() && !cancelled() &&
          github.repository == '3ru/eslint-plugin-baseline-js' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - name: Record trusted run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p conformance/results/collected
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '{repository: .repository.full_name, id: (.id | tostring), number: .run_number, attempt: .run_attempt, commit: .head_sha, startedAt: (.run_started_at // .created_at)}' \
            > conformance/results/publication-context.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
            | jq '[.[].jobs[]]' > conformance/results/publication-jobs.json
      - name: Download shared input
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compatibility-input
          path: conformance/results/collected
      - name: Download pinned observations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compatibility-pinned
          path: conformance/results/collected/pinned
      - name: Download latest observations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compatibility-latest
          path: conformance/results/collected/latest
      - name: Publish both outcomes atomically
        run: >-
          node conformance/publish.ts
          --input conformance/results/collected
          --context conformance/results/publication-context.json
          --jobs conformance/results/publication-jobs.json
