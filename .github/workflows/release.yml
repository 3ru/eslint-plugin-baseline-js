name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write  # OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
        
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Verify signatures
        run: npm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit dependencies
        run: |
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          cp package.json pnpm-lock.yaml "$audit_dir/"
          cat > "$audit_dir/pnpm-workspace.yaml" <<'YAML'
          auditConfig:
            ignoreGhsas:
              - GHSA-vfj7-8cjw-p6xm
          YAML
          pnpm --dir "$audit_dir" audit --audit-level high

      - name: Regenerate baseline data (features + descriptors)
        run: pnpm gen:data

      - name: Verify descriptor ↔ compat key integrity
        run: pnpm check:descriptor-compat

      - name: Verify generated data is committed
        run: pnpm check:generated-data

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Generate coverage report (docs/coverage.md)
        run: pnpm gen:coverage

      - name: Release with semantic-release (Trusted Publishing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then rm -f "${NPM_CONFIG_USERCONFIG}" || true; fi
          unset NODE_AUTH_TOKEN || true
          pnpm exec semantic-release
