name: Perf sweep

# Weekly scale sweep and A/A control of use-baseline on the synthetic corpus.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      scales:
        description: "Untyped scales"
        type: string
        default: "1,4,16"
      typed_scales:
        description: "Type-aware scales (empty skips)"
        type: string
        default: "1,4"

permissions: {}
cache-mode: none

concurrency:
  group: perf-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: scale sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Scale sweep
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCALES: ${{ inputs.scales }}
          TYPED_SCALES: ${{ inputs.typed_scales }}
        run: |
          # Defaults set here: `inputs.x || '…'` would turn an empty typed_scales back into the default.
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            SCALES="1,4,16"
            TYPED_SCALES="1,4"
          fi
          node scripts/bench/sweep.mts \
            --scales "$SCALES" \
            --typed-scales "$TYPED_SCALES" \
            --out bench-sweep.json \
            --summary bench-sweep-summary.md
          cat bench-sweep-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Runs even when the sweep flagged growth: every week adds a noise sample.
      - name: A/A control (this commit against itself)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/bench/compare.mts \
            --base HEAD \
            --head . \
            --scale 1 \
            --out bench-aa.json \
            --summary bench-aa-summary.md
          cat bench-aa-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-sweep
          path: |
            bench-sweep.json
            bench-sweep-summary.md
            bench-aa.json
            bench-aa-summary.md
          retention-days: 90
          if-no-files-found: ignore
