name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
          
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
        
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile
          
      - name: Format check (Biome)
        run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    needs: [format]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        eslint-version: ['9.29.0', '10']
    name: test (eslint@${{ matrix.eslint-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Override ESLint version
        if: matrix.eslint-version != '10'
        run: pnpm add -D eslint@${{ matrix.eslint-version }} --no-lockfile

      - name: Regenerate baseline data (features + descriptors)
        run: pnpm gen:data

      - name: Verify descriptor ↔ compat key integrity
        run: pnpm check:descriptor-compat

      - name: Verify generated data is committed
        run: pnpm check:generated-data

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  conformance:
    name: Compatibility report tests
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: conformance/pnpm-lock.yaml
      - name: Install reviewed harness dependencies
        run: pnpm --dir conformance install --frozen-lockfile --ignore-scripts
      - name: Check harness types
        run: pnpm --dir conformance typecheck
      - name: Test assessment and publication behavior
        run: pnpm --dir conformance test
